aid: underdog-fantasy
name: Underdog Fantasy
description: 'Underdog (Underdog Sports, formerly Underdog Fantasy) is a Brooklyn,
  New York based sports gaming company founded in 2020 by Jeremy Levine that operates
  daily fantasy sports, pick''em, and — since 2025 — federally regulated sports prediction
  markets on its own proprietary technology stack. Its consumer products include Classic
  Pick''em, Pick''em Champions, Best Ball and other Draft Games, Streaks, Team Picks,
  and the Underdog Predict prediction-markets exchange, delivered through iOS, Android,
  and web apps rather than a public developer API. Underdog reached roughly $500M in
  annual revenue within five years, was valued at $1.2B after a Spark Capital-led Series
  C in March 2025, acquired CFTC-registered derivatives infrastructure in March 2026,
  and in July 2026 was the subject of a proposed acquisition by IG Group. The company
  publishes no developer portal, API documentation, or machine-readable API contract;
  its public technical surface is limited to an RFC 9116 security.txt with a PGP key,
  a Honeybadger-hosted status page covering its API and Stats services, and the Underdog-Inc
  GitHub organization.'
